name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (secret, never printed)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build unsigned release
        run: ./gradlew assembleFossRelease --stacktrace
      - name: Sign
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          VERSION=${GITHUB_REF_NAME#v}
          IN=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          OUT="swipeskip-${VERSION}-foss-release.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --out "$OUT" "$IN"
          sha256sum "$OUT" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            swipeskip-*-foss-release.apk
            SHA256SUMS.txt
