name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (secret, never printed)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build unsigned release
        run: ./gradlew assembleFossRelease --stacktrace
      - name: Sign
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          VERSION=${GITHUB_REF_NAME#v}
          IN=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          OUT="swipeskip-${VERSION}-foss-release.apk"
          "$APKSIGNER" sign --alignment-preserved true --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --out "$OUT" "$IN"
          sha256sum "$OUT" > SHA256SUMS.txt
      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # GitHub's own CLI instead of a third-party action: no outside code runs in the job that handles the signing key.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" swipeskip-*-foss-release.apk SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
