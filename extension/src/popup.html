<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>SwipeSkip</h1>
  <form id="f">
    <label><span data-i18n="mode"></span>
      <select id="mode">
        <option value="videoEnd" data-i18n="modeEnd"></option>
        <option value="timer" data-i18n="modeTimer"></option>
      </select>
    </label>
    <label id="intervalRow"><span data-i18n="interval"></span>
      <input id="intervalSec" type="number" min="3" max="120" step="1">
    </label>
    <label><span data-i18n="duration"></span>
      <select id="durationMin">
        <option>15</option><option>30</option><option>60</option><option>120</option><option>240</option>
      </select>
    </label>
    <label><span data-i18n="maxScrolls"></span>
      <input id="maxScrolls" type="number" min="0" max="10000" step="1">
    </label>
    <label class="check"><input id="tapSkip" type="checkbox"><span data-i18n="tapSkip"></span></label>
    <p class="hint" data-i18n="tapSkipHint"></p>
    <button id="toggle" type="submit"></button>
  </form>
  <p id="state" role="status"></p>
  <p class="hint" data-i18n="notAffiliated"></p>
  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
