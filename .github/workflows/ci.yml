name: CI
on:
  push:
  pull_request:
permissions:
  contents: read   # the build only reads the code; a pull request can never write to the repository
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Browser extension engine tests
        run: node --test extension/test/engine.test.js
      - run: ./gradlew test lint assembleFossDebug assemblePlayDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
